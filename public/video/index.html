<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Later — выжимки из видео про AI, разработку и стартапы</title>
<meta name="description" content="Что внутри видео — до того, как вы потратите на него сорок минут. Краткие выжимки, тайм-коды, транскрипты.">
<style>
:root{
  color-scheme: light;
  --ground:#F1F2EE;
  --panel:#FFFFFF;
  --rule:#D9DBD3;
  --ink:#14181C;
  --ink-2:#4C5560;
  --ink-3:#7C8792;
  --signal:#9A6413;
  --signal-soft:#F0E4CE;
  --track:#E2E4DC;
  --focus:#1E5FB0;

  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: Roboto, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:56px;
  --measure:66ch;
  --wrap:920px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --ground:#101419;
    --panel:#171C22;
    --rule:#262D36;
    --ink:#E7EAED;
    --ink-2:#A3ADB8;
    --ink-3:#6F7A86;
    --signal:#D89A3E;
    --signal-soft:#2A2317;
    --track:#222932;
    --focus:#6FA8F0;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --ground:#F1F2EE; --panel:#FFFFFF; --rule:#D9DBD3; --ink:#14181C; --ink-2:#4C5560;
  --ink-3:#7C8792; --signal:#9A6413; --signal-soft:#F0E4CE; --track:#E2E4DC; --focus:#1E5FB0;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#101419; --panel:#171C22; --rule:#262D36; --ink:#E7EAED; --ink-2:#A3ADB8;
  --ink-3:#6F7A86; --signal:#D89A3E; --signal-soft:#2A2317; --track:#222932; --focus:#6FA8F0;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.55;
  font-variant-numeric:tabular-nums;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:2px}
img{max-width:100%; display:block}
button{font:inherit; color:inherit}

.wrap{max-width:var(--wrap); margin:0 auto; padding:0 var(--s4)}

/* ---------- шапка сайта ---------- */
.site{border-bottom:1px solid var(--rule)}
.site-in{display:flex; align-items:center; gap:var(--s5); flex-wrap:wrap; padding-block:var(--s3)}
.brand{font-family:var(--mono); font-size:13px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; white-space:nowrap}
.site-nav{display:flex; gap:var(--s4); flex-wrap:wrap; margin-left:auto; align-items:center}
.site-nav a{font-size:14px; color:var(--ink-2); text-decoration:none}
.site-nav a:hover,.site-nav a[aria-current]{color:var(--ink)}
.site-nav a[aria-current]{box-shadow:inset 0 -2px 0 var(--signal)}
.theme-btn{background:none; border:1px solid var(--rule); border-radius:2px; padding:2px 8px; cursor:pointer;
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.theme-btn:hover{color:var(--ink); border-color:var(--ink-3)}

/* ---------- интро ---------- */
.intro{padding-block:var(--s6) var(--s5)}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--signal); margin:0 0 var(--s3)}
h1{font-size:clamp(30px,5.5vw,42px); line-height:1.12; letter-spacing:-.02em; margin:0 0 var(--s4); text-wrap:balance; font-weight:700}
.lede{max-width:var(--measure); color:var(--ink-2); margin:0 0 var(--s4); font-size:17px}
.intro-links{display:flex; gap:var(--s4); flex-wrap:wrap; font-size:14px}
.intro-links a{color:var(--signal); text-underline-offset:3px}

/* ---------- панель фильтров ---------- */
.bar{position:sticky; top:0; z-index:5; background:var(--ground); border-block:1px solid var(--rule);
  padding-block:var(--s3); margin-bottom:var(--s2)}
.bar-row{display:flex; gap:var(--s3); align-items:center; flex-wrap:wrap}
.search{flex:1 1 220px; min-width:0; background:var(--panel); border:1px solid var(--rule); border-radius:2px;
  padding:8px 10px; font:inherit; font-size:14px; color:var(--ink)}
.search::placeholder{color:var(--ink-3)}
.tags{display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:var(--s3)}
.chip{background:none; border:1px solid var(--rule); border-radius:2px; padding:3px 9px; cursor:pointer;
  font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--ink-2); white-space:nowrap}
.chip:hover{border-color:var(--ink-3); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--signal-soft); border-color:var(--signal); color:var(--signal)}
.chip .n{color:var(--ink-3); margin-left:5px}
.chip[aria-pressed="true"] .n{color:var(--signal); opacity:.7}
.count{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}

/* ---------- очередь ---------- */
.queue{list-style:none; margin:0; padding:0}
.item{border-bottom:1px solid var(--rule)}
.item a.row{display:grid; grid-template-columns:132px 1fr; gap:var(--s4); padding:var(--s4) 0;
  text-decoration:none; color:inherit; align-items:start}
.item a.row:hover .title{color:var(--signal)}
.thumb{position:relative; aspect-ratio:16/9; background:var(--track); border-radius:2px; overflow:hidden}
.thumb img{width:100%; height:100%; object-fit:cover}
.dur{position:absolute; right:4px; bottom:4px; background:rgba(8,10,13,.82); color:#F2F3F0;
  font-family:var(--mono); font-size:11px; padding:1px 4px; border-radius:2px}
.meta{font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--ink-3);
  display:flex; gap:var(--s3); flex-wrap:wrap; margin-bottom:var(--s2)}
.title{font-size:17px; font-weight:600; line-height:1.3; margin:0 0 var(--s2); text-wrap:balance}
.sum{margin:0; color:var(--ink-2); font-size:14.5px; max-width:var(--measure)}
.row-tags{display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:var(--s3)}
.tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--ink-3); text-transform:uppercase}
.tag::before{content:"#"}
.empty{padding:var(--s7) 0; text-align:center; color:var(--ink-3)}

/* ---------- разбор ---------- */
.detail{padding-block:var(--s5) var(--s7)}
.back{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); text-decoration:none; margin-bottom:var(--s5)}
.back:hover{color:var(--ink)}
.detail h2{font-size:clamp(24px,4.4vw,33px); line-height:1.18; letter-spacing:-.015em; margin:0 0 var(--s3); text-wrap:balance}
.detail .sum{font-size:17px; color:var(--ink-2); margin-bottom:var(--s5)}
.player{display:block; position:relative; aspect-ratio:16/9; border-radius:3px; overflow:hidden;
  background:var(--track); margin-bottom:var(--s5); max-width:600px}
.player img{width:100%;height:100%;object-fit:cover}
.player .play{position:absolute; inset:0; display:grid; place-items:center}
.player .play span{background:rgba(8,10,13,.78); color:#F2F3F0; font-family:var(--mono); font-size:12px;
  letter-spacing:.1em; text-transform:uppercase; padding:8px 14px; border-radius:2px}
.player:hover .play span{background:var(--signal); color:#0E1014}
h3.sec{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--signal); margin:var(--s6) 0 var(--s3); padding-bottom:var(--s2); border-bottom:1px solid var(--rule)}
.takeaways{margin:0; padding:0; list-style:none; max-width:var(--measure)}
.takeaways li{padding-left:var(--s5); position:relative; margin-bottom:var(--s3)}
.takeaways li::before{content:counter(wl) "."; counter-increment:wl;
  position:absolute; left:0; top:1px; font-family:var(--mono); font-size:12px; color:var(--ink-3)}
.takeaways{counter-reset:wl}
.tc{list-style:none; margin:0; padding:0}
.tc li{border-bottom:1px solid var(--rule)}
.tc a{display:flex; gap:var(--s4); padding:9px 0; text-decoration:none; align-items:baseline}
.tc a:hover .tc-l{color:var(--signal)}
.tc-t{font-family:var(--mono); font-size:13px; color:var(--signal); min-width:56px}
.tc-l{color:var(--ink-2); font-size:14.5px}
.files{display:flex; gap:var(--s3); flex-wrap:wrap; margin-top:var(--s4)}
.file{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--rule); border-radius:2px;
  padding:8px 12px; text-decoration:none; font-size:14px; background:var(--panel)}
.file:hover{border-color:var(--signal); color:var(--signal)}
.file .kind{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.file:hover .kind{color:var(--signal)}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:var(--s4);
  border-top:1px solid var(--rule); padding-top:var(--s4); margin-top:var(--s6)}
.fact dt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
.fact dd{margin:0; font-size:14.5px}

footer{border-top:1px solid var(--rule); margin-top:var(--s7); padding-block:var(--s5) var(--s6);
  color:var(--ink-3); font-size:13.5px}
footer a{color:var(--ink-2)}

@media (max-width:560px){
  .item a.row{grid-template-columns:96px 1fr; gap:var(--s3)}
  .title{font-size:16px}
  .site-nav{width:100%; margin-left:0}
}
@media (prefers-reduced-motion: no-preference){
  a,.chip,.file{transition:color .12s ease, border-color .12s ease, background-color .12s ease}
}
</style>
</head>
<body>

<header class="site">
  <div class="wrap site-in">
    <a class="brand" href="/">Старцев</a>
    <nav class="site-nav">
      <a href="/video/" aria-current="page">Watch Later</a>
      <a href="/asapmail/">ASAP Mail</a>
      <a href="/vacancy/">Вакансии CRM</a>
      <a href="/blog/">Блог</a>
      <button class="theme-btn" id="theme" type="button">тема</button>
    </nav>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer>
  <div class="wrap" style="padding:0">
    Канал в Telegram: <a href="https://t.me/watchlater">@watchlater</a> · предложить видео: <a href="https://t.me/watchlater_bot">@watchlater_bot</a>
  </div>
</footer>

<template id="t-list">
  <section class="intro">
    <p class="eyebrow">Раздел · Watch Later</p>
    <h1>Что внутри видео — до того, как вы отдали ему сорок минут</h1>
    <p class="lede">Папка «смотреть позже» давно превратилась в кладбище: десяток роликов про AI, разработку и стартапы в день, и ни по одному не понять, что там, пока не откроешь. Здесь — содержание: о чём, ключевые мысли, тайм-коды, ссылка на оригинал и полная транскрибация файлом. Без оценок «стоит / не стоит» — это решаете вы.</p>
    <p class="intro-links">
      <a href="https://t.me/watchlater">Читать в Telegram</a>
      <a href="https://t.me/watchlater_bot">Предложить видео</a>
    </p>
  </section>

  <div class="bar">
    <div class="wrap" style="padding:0">
      <div class="bar-row">
        <input class="search" id="q" type="search" placeholder="Поиск по названию, выводам, каналу" aria-label="Поиск">
        <span class="count" id="count"></span>
      </div>
      <div class="tags" id="tags"></div>
    </div>
  </div>

  <ul class="queue" id="queue"></ul>
</template>

<script>
const DATA_URL = 'data/index.json';
const app = document.getElementById('app');
let items = [], tags = [], active = new Set(), query = '';

/* ---------- тема ---------- */
const themeBtn = document.getElementById('theme');
const stored = localStorage.getItem('wl-theme');
if (stored) document.documentElement.setAttribute('data-theme', stored);
themeBtn.addEventListener('click', () => {
  const now = document.documentElement.getAttribute('data-theme');
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const current = now === 'dark' || now === 'light' ? now : (sysDark ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('wl-theme', next);
});

/* ---------- утилиты ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = sec => {
  sec = Math.round(sec || 0);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
};
const ru = d => {
  const M = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const x = new Date(d + 'T00:00:00');
  return isNaN(x) ? '' : `${x.getDate()} ${M[x.getMonth()]}`;
};
const thumb = it => it.thumb || (it.video_id ? `https://i.ytimg.com/vi/${it.video_id}/mqdefault.jpg` : '');
const watchAt = (it, t) => it.video_id ? `https://www.youtube.com/watch?v=${it.video_id}${t?'&t='+Math.round(t):''}` : it.url;

/* ---------- список ---------- */
function renderList(){
  app.replaceChildren(document.getElementById('t-list').content.cloneNode(true));

  const box = document.getElementById('tags');
  box.append(...tags.map(([name, n]) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.setAttribute('aria-pressed', active.has(name));
    b.innerHTML = esc(name) + ` <span class="n">${n}</span>`;
    b.addEventListener('click', () => {
      active.has(name) ? active.delete(name) : active.add(name);
      b.setAttribute('aria-pressed', active.has(name));
      paint();
    });
    return b;
  }));

  const q = document.getElementById('q');
  q.value = query;
  q.addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); paint(); });
  paint();
}

function paint(){
  const list = items.filter(it => {
    if (active.size && !(it.tags||[]).some(t => active.has(t))) return false;
    if (!query) return true;
    const hay = [it.title, it.summary, it.channel, it.original_title, ...(it.takeaways||[]), ...(it.tags||[])]
      .join(' ').toLowerCase();
    return hay.includes(query);
  });

  document.getElementById('count').textContent = `${list.length} из ${items.length}`;
  const ul = document.getElementById('queue');

  if (!list.length){
    ul.innerHTML = '<li class="empty">Ничего не нашлось. Снимите фильтры или уточните запрос.</li>';
    return;
  }

  ul.innerHTML = list.map(it => `
    <li class="item">
      <a class="row" href="#/${esc(it.slug)}">
        <span class="thumb">
          ${thumb(it) ? `<img src="${esc(thumb(it))}" alt="" loading="lazy">` : ''}
          ${it.duration ? `<span class="dur">${hhmm(it.duration)}</span>` : ''}
        </span>
        <span>
          <span class="meta">
            <span>${esc(it.channel || '')}</span>
            ${it.added ? `<span>добавлено ${ru(it.added)}</span>` : ''}
            ${it.transcript ? '<span>транскрипт</span>' : ''}
          </span>
          <span class="title">${esc(it.title)}</span>
          <p class="sum">${esc(it.summary)}</p>
          <span class="row-tags">${(it.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</span>
        </span>
      </a>
    </li>`).join('');
}

/* ---------- разбор ---------- */
function renderItem(slug){
  const it = items.find(x => x.slug === slug);
  if (!it){ location.hash = ''; return; }
  document.title = it.title + ' — Watch Later';

  app.innerHTML = `
  <article class="detail">
    <a class="back" href="#">← Вся очередь</a>
    <p class="eyebrow">${(it.tags||[]).map(esc).join(' · ')}</p>
    <h2>${esc(it.title)}</h2>
    <p class="sum">${esc(it.summary)}</p>

    <a class="player" href="${esc(watchAt(it))}" target="_blank" rel="noopener">
      ${thumb(it) ? `<img src="${esc(thumb(it))}" alt="Обложка видео">` : ''}
      <span class="play"><span>Смотреть на YouTube · ${hhmm(it.duration)}</span></span>
    </a>

    ${(it.takeaways||[]).length ? `
      <h3 class="sec">Что забрать</h3>
      <ol class="takeaways">${it.takeaways.map(t => `<li>${esc(t)}</li>`).join('')}</ol>` : ''}

    ${(it.timecodes||[]).length ? `
      <h3 class="sec">Тайм-коды</h3>
      <ul class="tc">${it.timecodes.map(t => `
        <li><a href="${esc(watchAt(it, t.t))}" target="_blank" rel="noopener">
          <span class="tc-t">${hhmm(t.t)}</span><span class="tc-l">${esc(t.label)}</span>
        </a></li>`).join('')}</ul>` : ''}

    <h3 class="sec">Файлы и ссылки</h3>
    <div class="files">
      <a class="file" href="${esc(it.url)}" target="_blank" rel="noopener"><span class="kind">Видео</span> Оригинал на YouTube</a>
      ${it.transcript ? `<a class="file" href="${esc(it.transcript)}" target="_blank"><span class="kind">MD</span> Полная транскрибация</a>` : ''}
      ${it.tg_post ? `<a class="file" href="${esc(it.tg_post)}" target="_blank" rel="noopener"><span class="kind">TG</span> Пост в канале</a>` : ''}
    </div>

    <dl class="facts">
      <div class="fact"><dt>Канал</dt><dd>${esc(it.channel || '—')}</dd></div>
      <div class="fact"><dt>Длительность</dt><dd>${hhmm(it.duration)}</dd></div>
      <div class="fact"><dt>Опубликовано</dt><dd>${esc(ru(it.published) || '—')}</dd></div>
      <div class="fact"><dt>Язык</dt><dd>${esc((it.lang || '').toUpperCase() || '—')}</dd></div>
    </dl>
  </article>`;
  window.scrollTo(0, 0);
}

/* ---------- роутер ---------- */
function route(){
  const m = location.hash.match(/^#\/(.+)$/);
  if (m) renderItem(decodeURIComponent(m[1]));
  else { document.title = 'Watch Later — выжимки из видео про AI, разработку и стартапы'; renderList(); }
}
addEventListener('hashchange', route);

fetch(DATA_URL, {cache:'no-cache'})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(json => {
    items = (Array.isArray(json) ? json : json.items || [])
      .filter(x => x && x.slug)
      .sort((a,b) => String(b.added||'').localeCompare(String(a.added||'')));
    const counts = {};
    items.forEach(it => (it.tags||[]).forEach(t => counts[t] = (counts[t]||0)+1));
    tags = Object.entries(counts).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0],'ru'));
    route();
  })
  .catch(() => {
    app.innerHTML = '<p class="empty">Каталог не загрузился: файл <code>data/index.json</code> недоступен. На локальной машине откройте страницу через веб-сервер, а не двойным кликом по файлу.</p>';
  });
</script>
</body>
</html>
